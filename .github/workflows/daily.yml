name: danscout
on:
  schedule:
    - cron: "30 10 * * *"   # 北京 18:30
    - cron: "50 11 * * *"   # 北京 19:50
    - cron: "38 12 * * *"   # 北京 20:38
  workflow_dispatch:
    inputs:
      model_text:
        description: "文本模型覆盖（留空用 vars.MODEL_TEXT）"
        default: ""
      model_vision:
        description: "视觉模型覆盖（留空用 vars.MODEL_VISION）"
        default: ""

permissions:
  contents: write

env:
  VLESS_URL: ${{ secrets.VLESS_URL }}
  TG_TOKEN: ${{ secrets.TG_TOKEN }}
  TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
  MODEL_TEXT: ${{ inputs.model_text || vars.MODEL_TEXT || 'kilo/kilo-auto/free' }}
  MODEL_VISION: ${{ inputs.model_vision || vars.MODEL_VISION || 'kilo/thinkingmachines/inkling:free' }}

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: install sing-box
        run: |
          curl -fsSL -o /tmp/sb.tgz https://github.com/SagerNet/sing-box/releases/download/v1.14.4/sing-box-1.14.4-linux-amd64.tar.gz
          tar xzf /tmp/sb.tgz -C /tmp
          cp /tmp/sing-box-1.14.4-linux-amd64/sing-box bin/singbox

      - name: install kilo cli
        run: npm i -g @kilocode/cli

      - name: start proxy
        run: bash bin/start-proxy.sh

      - name: show bound models
        run: echo "MODEL_TEXT=$MODEL_TEXT | MODEL_VISION=$MODEL_VISION"

      - name: collect + aggregate
        run: python3 aggregate.py

      - name: commit data
        run: |
          git config user.name "danscout-bot"
          git config user.email "bot@danscout.local"
          git add data/
          git commit -m "data: $(date -u +%F_%H%M) collection" || echo "nothing new"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase || git rebase --abort || true
          done
          git push

      - name: deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CF_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CF_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          mkdir -p /tmp/site && cp index.html app.js /tmp/site/ && cp -r data /tmp/site/
          npx -y wrangler@latest pages deploy /tmp/site --project-name danscout --branch main

      - name: TG alert on failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT_ID}" -d parse_mode=HTML \
            --data-urlencode "text=<b>⚠️ danscout 采集失败</b> $(date -u +%F\ %H:%M) UTC，请查 workflow 日志"
